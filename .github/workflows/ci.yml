name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: nf-core/setup-nextflow@v1
      - uses: nf-core/setup-nf-test@v1
      - name: Install linters and Python test runner
        run: python -m pip install pre-commit pytest pysam
      - name: Validate formatting and Nextflow preview
        run: pre-commit run --all-files
      # The report image is built here rather than pulled, so a change to it is tested
      # before it is published, and QUARTO_REPORT's stub finds it locally.
      - uses: docker/setup-buildx-action@v3
      - name: Build the report image
        uses: docker/build-push-action@v6
        with:
          context: containers/report
          load: true
          tags: ghcr.io/timrozday-mgnify/isolate-genome-assembler-report:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Stub tasks run inside the pinned containers. Several modules report their version
      # with an `eval` output, which needs the tool present even in a stub run, and running
      # them in the real images also proves every pinned tag still resolves.
      - name: Run stub workflow tests
        run: nf-test test --tag stub --ci --profile docker
      - name: Run Python tests
        run: pytest
      # tests/test_report.py skips outside the report image, so it runs again inside it.
      - name: Render the report from the fixture
        run: >-
          docker run --rm -v "$PWD:$PWD" -w "$PWD"
          ghcr.io/timrozday-mgnify/isolate-genome-assembler-report:latest
          sh -c 'pip install -q pytest && python -m pytest -p no:cacheprovider tests/test_report.py'
