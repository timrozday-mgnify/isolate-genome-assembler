name: Build container image

# Builds the report image (Quarto + the Python the report template imports) and pushes it
# to GHCR. The package is published publicly so HPC pulls need no authentication.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['containers/report/**', '.github/workflows/build-images.yml']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: containers/report
          push: true
          # Single-platform, no attestations: buildx's default provenance/SBOM
          # attestations make the pushed ref an OCI index with an unknown/unknown
          # manifest that Singularity/Apptainer can't convert to SIF.
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: |
            ghcr.io/timrozday-mgnify/isolate-genome-assembler-report:latest
            ghcr.io/timrozday-mgnify/isolate-genome-assembler-report:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
